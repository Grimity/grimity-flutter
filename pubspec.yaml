name: grimity
description: 그림쟁이들을 위한 그림 커뮤니티, 그리미티에 대한 Flutter 기반의 모바일 애플리케이션입니다.
publish_to: none
version: 1.1.11-38

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  # Design System
  gds:
    git:
      url: https://github.com/Grimity/gds-flutter
      ref: main

  # UI
  animations: ^2.0.11
  cached_network_image: ^3.4.1
  carousel_slider: ^5.0.0
  flutter_animate: ^4.5.2
  flutter_svg: ^2.1.0
  fluttertoast: ^9.1.0
  gap: ^3.0.1
  mesh_gradient: ^1.3.8
  photo_manager: ^3.5.0
  skeletonizer: ^2.0.1
  custom_image_crop: ^0.1.1
  lottie: ^3.3.1
  photo_view: ^0.15.0
  readmore: ^3.0.0
  flutter_widget_from_html: ^0.17.0
  flutter_linkify: ^6.0.0
  flutter_quill: ^11.4.2
  flutter_quill_delta_from_html: ^1.5.3
  vsc_quill_delta_to_html: ^1.0.5
  flutter_quill_extensions: ^11.0.0
  flutter_refresh_indicator: ^1.2.3
  flutter_infinite_scroll_pagination: ^1.2.2
  flutter_appbar: ^1.7.0
  dynamic_height_list_view: ^0.0.2
  expandable_page_view: ^1.1.0
  go_router: ^17.3.0

  # Network
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0

  # Database
  flutter_secure_storage: ^10.3.1
  shared_preferences: ^2.5.3

  # Logger
  get_it: ^9.2.1
  injectable: ^2.5.0
  talker: ^5.1.17
  talker_dio_logger: ^5.1.17
  talker_flutter: ^5.1.16
  talker_riverpod_logger: ^5.1.17
  dio: ^5.8.0+1
  mockito: ^5.4.5
  retrofit: ^4.4.2

  # Utils
  firebase_core: ^4.2.0
  firebase_messaging: ^16.0.3
  firebase_analytics: ^12.0.3
  firebase_crashlytics: ^5.0.3

  # Share
  kakao_flutter_sdk_share: ^1.9.7+3

  # OAuth
  google_sign_in: ^6.3.0
  kakao_flutter_sdk_user: ^1.9.7+3
  sign_in_with_apple: ^8.1.0

  # Architecture
  flutter_hooks: ^0.21.2
  flutter_riverpod: ^3.1.0
  hooks_riverpod: ^3.1.0
  riverpod_annotation: ^4.0.0
  collection: ^1.19.1
  device_info_plus: ^12.4.0
  flutter_gen: ^5.10.0
  flutter_image_compress: ^2.4.0
  flutter_native_splash: ^2.4.5
  intl: ^0.20.2
  image_picker: ^1.1.2
  path_provider: ^2.1.5
  url_launcher: ^6.3.1
  uuid: ^4.5.1
  vector_graphics: ^1.1.18
  flutter_dotenv: ^6.0.1
  socket_io_client: ^3.1.2
  flutter_local_notifications: ^22.0.1
  flutter_launcher_icons: ^0.14.4
  visibility_detector: ^0.4.0+2
  package_info_plus: ^9.0.0
  flutter_app_badge: ^2.0.2
  gal: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.4.15
  custom_lint: ^0.8.1
  flutter_gen_runner: ^5.10.0
  freezed: ^3.0.4
  go_router_builder: ^4.3.0
  injectable_generator: ^2.7.0
  json_serializable: ^6.9.4
  retrofit_generator: ^10.2.1
  riverpod_generator: ^4.0.0+1
  riverpod_lint: ^3.1.0
  git_config: ^1.1.0
  change_app_package_name: ^1.5.0
  yaml: ^3.1.3
  args: ^2.7.0
  dotenv: ^4.2.0
  pubspec_version_tool: ^1.0.0

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/icons/editor/
    - assets/icons/icon/
    - assets/icons/illust/
    - assets/icons/brand/
    - assets/icons/ranking/
    - assets/images/
    - assets/images/sign_up/
    - assets/images/profile/
    - assets/images/image/
    - assets/lottie/
  fonts:
    - family: Pretendard
      fonts:
      - asset: assets/fonts/Pretendard-Regular.otf
        weight: 400
      - asset: assets/fonts/Pretendard-Medium.otf
        weight: 500
      - asset: assets/fonts/Pretendard-SemiBold.otf
        weight: 600
      - asset: assets/fonts/Pretendard-Bold.otf
        weight: 700

flutter_gen:
  output: lib/gen/
  line_length: 80

  integrations:
    flutter_svg: true
